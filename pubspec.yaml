name: p_ride
description: PRIME RIDES PUNE - cab booking app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.0
  url_launcher: ^6.3.0
  http: ^1.2.0
  razorpay_flutter: ^1.3.7
  supabase_flutter: ^2.18.3
  image_picker: ^1.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo prime ride car.jpeg"

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/images/
